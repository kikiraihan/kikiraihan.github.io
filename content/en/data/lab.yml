# Experiments and side-explorations that don't need a full case study.
items:
  - title: Ngoding5
    kind: Web app · Education
    year: 2026
    description: 'Indonesian-language practice site for programming logic and syntax, fully static with no login and no server: write code and run the test cases right in the browser (JavaScript in a Web Worker, Python through Skulpt), or read a program and guess its exact output. Each problem has tiered hints, a reference solution, an explanation, common mistakes and a "Copy to ask AI" button; progress stays in localStorage. 40 coding problems and 32 quizzes, all verified by running the JS and Python solutions against each other, with a content CLI and Claude Code skills to generate new ones. Vue 3 + Vite on Vercel.'
    tags: [Vue, Vite, TypeScript, Python, Education]
    image: /images/lab/ngoding5.webp
    url: https://github.com/kikiraihan/ngoding5-static
  - title: Racik
    kind: Web app · AI
    year: 2026
    description: 'Canva-style design editor with AI: write an idea and Claude lays out the whole design (layout, copy, palette, fonts) while an image model makes the visuals, then everything stays editable: text, images, layers, multiple pages. Export to PPTX with editable text, PDF, PNG/JPG and SVG. Rate results with 👍/👎 and set a Brand Kit, and the next designs follow your taste. Nuxt + fabric.js on the front, plain Go net/http and PostgreSQL behind it.'
    tags: [Vue, Nuxt, fabric.js, Go, PostgreSQL, AI]
    image: /images/lab/racik.webp
    url: /work/racik
    video: https://github.com/kikiraihan/racik/blob/main/video/racik-teaser.mp4
    live: https://racik.katili.dev
  - title: Our Day
    kind: Web app · PWA · SaaS
    year: 2026
    description: 'Shared photo album for weddings and events, filled by the guests themselves: they scan a QR code, type their name and shoot straight from the browser, with filters picked before the shutter, Locket-style stickers (time, weather, location) and no retake button. Photos and voice messages land in a live shared gallery; hosts moderate, download everything as a ZIP and get push notifications. Vue 3 + TypeScript PWA with a Go backend.'
    tags: [Vue, TypeScript, Go, PWA, Web Push]
    image: /images/lab/our-day.webp
    url: /work/our-day
    video: /videos/ourday-teaser.mp4
    live: https://ourday.katili.dev
  - title: AI Todo
    kind: macOS app · PWA · AI
    year: 2026
    description: 'Todo list and reminders you can run by chatting with an AI or by hand. One Go binary with SQLite, an installable Vue PWA with Web Push, and a Swift menu bar app with a badge, quick check-off and a chat panel (⌥⌘T). The AI only proposes actions; the server validates them, asks before deleting, and keeps everything undoable.'
    tags: [Go, SQLite, Vue, Swift, AppKit, AI]
    image: /images/lab/ai-todo.webp
    url: /work/ai-todo
    video: /videos/ai-todo-teaser.mp4
  - title: PasteLAN
    kind: macOS app · PWA · Server
    year: 2026
    description: 'Copy-paste text and images between a Mac and a phone through your own server: copy on the Mac and it shows up on the phone within a second; paste or pick images on the phone, tap Send, then ⌘V on the Mac. A Swift menu bar app with a clipboard history (⌘0–⌘9), a single Go binary with no dependencies that keeps clips in memory only, and an installable PWA with push notifications. No server? A local Wi-Fi mode pairs by QR code and encrypts everything with ChaCha20-Poly1305.'
    tags: [Swift, AppKit, Go, PWA, Web Push]
    image: /images/lab/pastelan.webp
    url: /work/pastelan
    video: https://github.com/kikiraihan/mac-os-PasteLAN/blob/main/video/pastelan-teaser.mp4
  - title: LiteCalendar
    kind: macOS app · Menu bar
    year: 2026
    description: 'Two-month calendar in the macOS menu bar: after the 15th it shows this month and next, before that the previous month and this one, with arrows, keys and trackpad swipes to move between months. Event dots come from the calendars on the Mac (iCloud, Google, Exchange) through EventKit. Pure Swift + AppKit in a single source file.'
    tags: [Swift, AppKit, macOS, EventKit]
    image: /images/lab/lite-calendar.webp
    url: https://github.com/kikiraihan/mac-os-calendar-two-sided
  - title: LiteScroller
    kind: macOS app · Menu bar
    year: 2026
    description: 'Menu bar separator for macOS that hides icons like Hidden Bar, plus a scroller mode: hidden icons appear in a scrollable strip over the menu bar, so they stay reachable even when long app menus or the notch would cover them. Pure Swift + AppKit in a single source file.'
    tags: [Swift, AppKit, macOS, Accessibility]
    image: /images/lab/lite-scroller.webp
    url: /work/litescroller
    video: https://github.com/kikiraihan/mac-os-lite-menu-bar-scroller/blob/main/video/litescroller-teaser.mp4
  - title: LiteMonitor
    kind: macOS app · Menu bar
    year: 2026
    description: 'Lightweight macOS menu bar indicator for CPU, RAM, SSD, network and battery. Pure Swift + AppKit in a single source file with no dependencies: normal or compact mode, pick which metrics to show, about 15–25 MB of RAM.'
    tags: [Swift, AppKit, macOS]
    image: /images/lab/lite-monitor.webp
    url: https://github.com/kikiraihan/mac-os-lite-monitor
  - title: my-commits.sh
    kind: CLI · Bash
    year: 2026
    description: 'Interactive commit reporter for many projects at once: pick a date range, the repos and the branches (wildcards like *kiki* work), and it lists your own commits per project and branch. The report shows in the terminal, can be saved to a file, or turned into a daily standup or weekly progress report with AI (Groq or Gemini), then copied to the clipboard.'
    tags: [Bash, Git, CLI, AI]
    image: /images/lab/my-commits.webp
    url: https://github.com/kikiraihan/reusable-bash-command
  - title: Git feature branch toolkit (gfb)
    kind: CLI · Zsh
    year: 2026
    description: 'A set of zsh commands for a feature-branch workflow: gfb creates a branch from a base, gfbls lists branches by last use, gfbstatus is a fuller git status with push/pull state and next steps, plus commands to compare branches, find conflicts before merging, clean up merged branches, and generate commit messages and PR descriptions with AI.'
    tags: [Zsh, Git, CLI, AI]
    image: /images/lab/git-featuring-branch.webp
    url: https://github.com/kikiraihan/reusable-bash-command
