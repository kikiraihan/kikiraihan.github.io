name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run generate
        env:
          NUXT_PUBLIC_SITE_URL: https://kikiraihan.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  # Manual deploy only (Actions → CI & Deploy → Run workflow → deploy: true).
  # Requires Settings → Pages → Source: "GitHub Actions".
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
