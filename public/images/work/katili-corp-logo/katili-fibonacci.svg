<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>The Fibonacci squares and golden spiral behind the Katili Corp mark</title>
  <rect width="960" height="400" fill="#27292A"/>

  <g transform="translate(60 80)">
    <!-- squares 8, 5, 3, 2, 1, 1 (unit = 30) -->
    <g fill="none" stroke="#3BA7D9" stroke-width="1.5" opacity="0.85">
      <rect x="0" y="0" width="240" height="240"/>
      <rect x="240" y="0" width="150" height="150"/>
      <rect x="300" y="150" width="90" height="90"/>
      <rect x="240" y="180" width="60" height="60"/>
      <rect x="240" y="150" width="30" height="30"/>
      <rect x="270" y="150" width="30" height="30"/>
    </g>
    <g fill="#3BA7D9" font-size="14" opacity="0.8">
      <text x="12" y="26">8</text>
      <text x="252" y="24">5</text>
      <text x="310" y="172">3</text>
      <text x="248" y="200">2</text>
      <text x="244" y="164" font-size="10">1</text>
      <text x="274" y="164" font-size="10">1</text>
    </g>
    <!-- the golden spiral: the same curve as the wind trail behind the bag -->
    <path d="M0 240 A240 240 0 0 1 240 0 A150 150 0 0 1 390 150 A90 90 0 0 1 300 240 A60 60 0 0 1 240 180 A30 30 0 0 1 270 150 A30 30 0 0 1 300 180" fill="none" stroke="#2C9C92" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="276" fill="#9AA0A6" font-size="14">13 × 8 — every square is the sum of the two before it</text>
  </g>

  <g transform="translate(540 96)">
    <text x="0" y="0" fill="#9AA0A6" font-size="13" letter-spacing="2">THE RATIO</text>
    <text x="0" y="56" fill="#ffffff" font-size="52" font-weight="600">1 : 1.618</text>
    <line x1="0" y1="88" x2="340" y2="88" stroke="#3a3d3f"/>
    <g font-size="16" fill="#E8EAED">
      <circle cx="6" cy="122" r="5" fill="#2C9C92"/>
      <text x="22" y="128">The spiral is the wind trailing the bag</text>
      <text x="22" y="150" fill="#9AA0A6" font-size="14">every struggle, turned into one stroke</text>
      <circle cx="6" cy="190" r="5" fill="#A8C64B"/>
      <text x="22" y="196">The bag is drawn from overlapping circles</text>
      <text x="22" y="218" fill="#9AA0A6" font-size="14">sized by the same proportions</text>
      <circle cx="6" cy="258" r="5" fill="#3BA7D9"/>
      <text x="22" y="264">One rule, so no angle feels arbitrary</text>
    </g>
  </g>
</svg>
